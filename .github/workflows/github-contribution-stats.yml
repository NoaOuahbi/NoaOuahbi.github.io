name: Update Noa GitHub activity snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate contribution SVG
        env:
          GITHUB_USERNAME: NoaOuahbi
          GITHUB_OUTPUT_PATH: ../public/assets/github-contribution-stats.svg
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-github-contribution-stats.mjs
      - name: Commit updated contribution stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/github-contribution-stats.svg
          if git diff --staged --quiet; then
            echo "Contribution stats are already current."
          else
            git commit -m "chore: update GitHub contribution stats"
            git push
          fi
